name: call_logger
description: "A Flutter application for automatic call monitoring and logging into SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # SQLite Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Permission Handling
  permission_handler: ^11.3.1

  # System Call Log Reader
  call_log: ^4.0.0

  # Local Key-Value Storage
  shared_preferences: ^2.2.3

  # Formatting & Date Handling
  intl: ^0.19.0

  # CSV Export & Sharing
  csv: ^6.0.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

